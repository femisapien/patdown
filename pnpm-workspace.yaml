packages:
  - apps/*
  - packages/*

allowBuilds:
  '@google/genai': false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@earendil-works/pi-coding-agent': 0.85.1
  '@oxlint/plugins': 1.80.0
  '@types/node': ^22.20.3
  '@typescript/typescript6': 6.0.2
  '@vitest/coverage-v8': ^5.0.1
  import-meta-resolve: 4.2.0
  lint-staged: ^17.4.1
  oxfmt: ^0.65.0
  oxlint: 1.80.0
  oxlint-tsgolint: ^7.0.2001
  turbo: ^2.10.12
  typescript: 7.0.2
  vitest: ^5.0.1

catalogs:
  effect:
    '@effect/ai-typesafe': 4.0.0-rc.116
    '@effect/language-service': 0.87.2
    '@effect/tsgo': 0.45.0
    '@effect/platform-node': 4.0.0-rc.116
    '@effect/vitest': 4.0.0-rc.116
    effect: 4.0.0-rc.116

# Keep platform-node-shared on the same rc as effect. A floating caret can pull a newer shared build that imports symbols the pinned effect rc does not have.
overrides:
  '@effect/platform-node-shared': 4.0.0-rc.116

engineStrict: true
frozenLockfile: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - pnpm
saveCatalogName: default
updateNotifier: false
